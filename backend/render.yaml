services:
  - type: web
    name: whiteboard-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ABLY_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
