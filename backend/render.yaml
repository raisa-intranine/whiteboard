services:
  - type: web
    name: whiteboard-backend
    env: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ABLY_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
